<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiSpark — Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="engispark-logo.png">
</head>
<body>
    <div class="quiz-container">
        <header class="quiz-header">
            <div class="header-left">
                <img src="engispark-logo.png" alt="EngiSpark Logo" class="header-logo">
                <span class="header-app-name">EngiSpark</span>
            </div>
            <div class="header-right">
                <span id="timerDisplay" class="timer">⏱️ 15:00</span>
            </div>
        </header>
        <div class="quiz-progress">
            <span id="questionCounter">প্রশ্ন ১/১০</span>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width:10%"></div>
            </div>
        </div>
        <div class="question-area">
            <h3 id="questionText">প্রশ্ন লোড হচ্ছে...</h3>
            <div id="optionsContainer" class="options-container"></div>
        </div>
        <div class="quiz-navigation">
            <button onclick="prevQuestion()" class="btn-nav" id="prevBtn">◄ আগে</button>
            <button onclick="nextQuestion()" class="btn-nav" id="nextBtn">পরে ►</button>
        </div>
        <button onclick="submitQuiz()" class="btn-primary btn-submit">✔ সাবমিট</button>
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="engispark-logo.png" alt="EngiSpark Logo" class="footer-logo-img">
                    <span class="footer-app-name">EngiSpark</span>
                </div>
                <p class="footer-tagline">Ignite Your Engineering Mind</p>
                <p class="footer-founder">
                    Founder: <a href="https://engispark.com" target="_blank">EngiSpark.com</a>
                </p>
                <p class="footer-copyright">© 2026 EngiSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
