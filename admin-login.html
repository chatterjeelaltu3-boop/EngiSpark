<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiSpark — Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="engispark-logo.png">
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <img src="engispark-logo.png" alt="EngiSpark Logo" class="admin-login-logo">
                <h2>🔐 অ্যাডমিন লগইন</h2>
            </div>
            <div class="admin-login-form">
                <div class="form-group">
                    <label>👤 ইউজারনেম</label>
                    <input type="text" id="adminUsername" placeholder="EngiSpark" value="EngiSpark" class="form-input">
                </div>
                <div class="form-group">
                    <label>🔑 পাসওয়ার্ড</label>
                    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন" class="form-input">
                </div>
                <button onclick="adminLogin()" class="btn-primary btn-admin-login">লগইন</button>
                <p id="adminError" class="error-message" style="display:none;">❌ ভুল ইউজারনেম বা পাসওয়ার্ড!</p>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="engispark-logo.png" alt="EngiSpark Logo" class="footer-logo-img">
                    <span class="footer-app-name">EngiSpark</span>
                </div>
                <p class="footer-tagline">Ignite Your Engineering Mind</p>
                <p class="footer-founder">
                    Founder: <a href="https://engispark.com" target="_blank">EngiSpark.com</a>
                </p>
                <p class="footer-copyright">© 2026 EngiSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
