<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - EngiSpark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page">

    <!-- ================= HEADER ================= -->

    <header>

        <a href="dashboard.html" class="brand">

            <img
                src="engispark-logo.png"
                alt="EngiSpark Logo"
            >

            <span>EngiSpark</span>

        </a>

        <button
            type="button"
            class="secondary"
            onclick="location.href='admin-login.html'"
        >
            🔐 Admin
        </button>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="container">

        <!-- Welcome Section -->

        <section class="welcome-section">

            <h1>
                👋 Welcome,
                <span id="userName">Student</span>!
            </h1>

            <p class="muted">
                Choose your quiz preferences and start learning.
            </p>

        </section>


        <!-- ================= WELCOME POPUP ================= -->

        <div
            id="welcomePopup"
            class="notice"
        >

            <span>
                🎓 <b>Welcome to EngiSpark!</b>
            </span>

            <button
                type="button"
                onclick="this.parentElement.remove()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- ================= START QUIZ ================= -->

        <section class="card quiz-section">

            <button
                type="button"
                class="quiztab"
                onclick="toggleQuizConfig()"
            >
                📝 Start Quiz
            </button>


            <!-- QUIZ SETTINGS -->

            <div
                id="quizConfig"
                class="quiz-config"
            >

                <div class="grid">


                    <!-- ================= YEAR ================= -->

                    <div>

                        <label for="yearSelect">
                            Year
                        </label>

                        <select id="yearSelect">

                            <option value="1st Year">
                                1st Year
                            </option>

                        </select>

                    </div>


                    <!-- ================= DEPARTMENT ================= -->

                    <div>

                        <label for="departmentSelect">
                            Department
                        </label>

                        <select id="departmentSelect">

                            <option value="CSE">
                                CSE
                            </option>

                            <option value="EE">
                                EE
                            </option>

                            <option value="Civil">
                                Civil
                            </option>

                            <option value="Mechanical">
                                Mechanical
                            </option>

                        </select>

                    </div>


                    <!-- ================= SUBJECT ================= -->

                    <div>

                        <label for="subjectSelect">
                            Subject
                        </label>

                        <select id="subjectSelect">

                            <option value="Mathematics">
                                Mathematics
                            </option>

                            <option value="Physics">
                                Physics
                            </option>

                            <option value="Chemistry">
                                Chemistry
                            </option>

                            <option value="Basic Electrical">
                                Basic Electrical
                            </option>

                        </select>

                    </div>


                    <!-- ================= DIFFICULTY ================= -->

                    <div>

                        <label for="difficultySelect">
                            Difficulty
                        </label>

                        <select id="difficultySelect">

                            <option value="Easy">
                                Easy
                            </option>

                            <option
                                value="Medium"
                                selected
                            >
                                Medium
                            </option>

                            <option value="Hard">
                                Hard
                            </option>

                        </select>

                    </div>


                    <!-- ================= TIME ================= -->

                    <div>

                        <label for="timeSelect">
                            Time
                        </label>

                        <select id="timeSelect">

                            <option value="10">
                                10 minutes
                            </option>

                            <option
                                value="15"
                                selected
                            >
                                15 minutes
                            </option>

                            <option value="20">
                                20 minutes
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ERROR MESSAGE -->

                <p
                    id="quizStartError"
                    class="error"
                    role="alert"
                ></p>


                <!-- START QUIZ BUTTON -->

                <button
                    type="button"
                    class="primary full"
                    onclick="startQuiz()"
                >
                    🚀 Start Quiz
                </button>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div>
            <strong>EngiSpark</strong>
            — Ignite Your Engineering Mind
        </div>

        <div>
            Made by Ayush Chatterjee
        </div>

        <div>

            <a
                href="https://founderappernam.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                founderappernam.com
            </a>

        </div>

        <div>
            © 2026 EngiSpark. All rights reserved.
        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
