<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification - EngiSpark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page center">

    <main class="card auth">

        <!-- Logo -->
        <img
            src="engispark-logo.png"
            alt="EngiSpark Logo"
            class="logo"
        >

        <!-- Title -->
        <h1>🔐 Verification</h1>

        <!-- Full Name -->
        <label for="userName">
            Your Full Name
        </label>

        <input
            type="text"
            id="userName"
            placeholder="Enter your full name"
            autocomplete="name"
        >

        <!-- CAPTCHA -->
        <div class="captcha">

            <b id="captchaCode">
                Loading...
            </b>

            <button
                type="button"
                onclick="generateCaptcha()"
                aria-label="Generate new CAPTCHA"
            >
                ↻
            </button>

        </div>

        <!-- CAPTCHA Input -->
        <label for="captchaInput">
            Enter CAPTCHA
        </label>

        <input
            type="text"
            id="captchaInput"
            placeholder="Type the CAPTCHA"
            autocomplete="off"
            spellcheck="false"
        >

        <!-- Error -->
        <p
            id="verificationError"
            class="error"
            role="alert"
        ></p>

        <!-- Verify -->
        <button
            type="button"
            class="primary full"
            onclick="verifyUser()"
        >
            Verify
        </button>

    </main>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
