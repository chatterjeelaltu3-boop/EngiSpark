<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result - EngiSpark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page">

    <!-- ================= HEADER ================= -->

    <header>

        <a href="dashboard.html" class="brand">

            <img
                src="engispark-logo.png"
                alt="EngiSpark Logo"
            >

            <span>EngiSpark</span>

        </a>

    </header>


    <!-- ================= RESULT CONTENT ================= -->

    <main class="container result-page">

        <!-- Logo -->

        <section class="result-header">

            <img
                src="engispark-logo.png"
                alt="EngiSpark Logo"
                class="result-logo"
            >

            <p class="tagline">
                Ignite Your Engineering Mind
            </p>

        </section>


        <!-- Result Title -->

        <section class="card result-card">

            <div class="result-icon">
                🎉
            </div>

            <h1>
                Quiz Result!
            </h1>

            <!-- Score -->

            <div class="score">

                <span id="score">
                    0/10
                </span>

                <div
                    id="percentage"
                    class="percentage"
                >
                    0%
                </div>

            </div>


            <!-- Stars -->

            <div
                id="stars"
                class="stars"
                aria-label="Quiz rating"
            >
                ⭐⭐⭐⭐⭐
            </div>


            <!-- Correct / Wrong -->

            <div class="result-stats">

                <div class="stat correct">

                    <span class="stat-icon">
                        ✔
                    </span>

                    <strong id="correctCount">
                        0
                    </strong>

                    <small>
                        Correct
                    </small>

                </div>


                <div class="stat wrong">

                    <span class="stat-icon">
                        ✘
                    </span>

                    <strong id="wrongCount">
                        0
                    </strong>

                    <small>
                        Wrong
                    </small>

                </div>

            </div>


            <!-- Time -->

            <div class="time-result">

                ⏱️ Time Taken:

                <strong id="timeTaken">
                    0 minutes 0 seconds
                </strong>

            </div>

        </section>


        <!-- ================= WRONG ANSWERS ================= -->

        <section
            id="wrongAnswersSection"
            class="card wrong-answers"
        >

            <h2>
                ❌ Incorrect Answers
            </h2>

            <div id="wrongAnswersList">

                <!-- Wrong answers will be added by JavaScript -->

            </div>

        </section>


        <!-- ================= BUTTONS ================= -->

        <div class="result-actions">

            <button
                type="button"
                class="primary"
                onclick="retakeQuiz()"
            >
                🔄 Retake Quiz
            </button>


            <button
                type="button"
                class="secondary"
                onclick="location.href='dashboard.html'"
            >
                🏠 Home
            </button>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div>
            <strong>EngiSpark</strong>
            — Ignite Your Engineering Mind
        </div>

        <div>
            Made by Ayush Chatterjee
        </div>

        <div>

            <a
                href="https://founderappernam.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                founderappernam.com
            </a>

        </div>

        <div>
            © 2026 EngiSpark. All rights reserved.
        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
