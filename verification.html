<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiSpark — Verification</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="engispark-logo.png">
</head>
<body>
    <div class="verification-container">
        <div class="verification-box">
            <div class="verification-header">
                <img src="engispark-logo.png" alt="EngiSpark Logo" class="verification-logo">
                <h2>🔐 ভেরিফিকেশন</h2>
                <p class="verification-sub">নিচে আপনার তথ্য দিন</p>
            </div>
            <div class="verification-form">
                <div class="form-group">
                    <label for="fullName">আপনার পুরো নাম লিখুন</label>
                    <input type="text" id="fullName" placeholder="যেমন: Ayush Chatterjee" class="form-input">
                </div>
                <div class="form-group">
                    <label>ক্যাপচা কোড</label>
                    <div class="captcha-box">
                        <span id="captchaText" class="captcha-text">X7#kL9</span>
                        <button type="button" id="refreshCaptcha" class="btn-refresh">⟳</button>
                    </div>
                    <input type="text" id="captchaInput" placeholder="ক্যাপচা টাইপ করুন" class="form-input">
                </div>
                <button id="verifyBtn" class="btn-primary btn-verify">✅ ভেরিফাই করুন</button>
                <p id="errorMsg" class="error-message" style="display:none;">❌ ক্যাপচা সঠিক নয়, আবার চেষ্টা করুন</p>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="engispark-logo.png" alt="EngiSpark Logo" class="footer-logo-img">
                    <span class="footer-app-name">EngiSpark</span>
                </div>
                <p class="footer-tagline">Ignite Your Engineering Mind</p>
                <p class="footer-founder">
                    Founder: <a href="https://engispark.com" target="_blank">EngiSpark.com</a>
                </p>
                <p class="footer-copyright">© 2026 EngiSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
