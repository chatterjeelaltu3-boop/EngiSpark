<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verification - EngiSpark</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="page verification-page">

    <!-- =================================================
         VERIFICATION SECTION
         ================================================= -->

    <main class="verification-wrapper">

        <section class="card auth">

            <!-- Logo -->
            <div class="verification-logo">

                <img
                    src="engispark-logo.png"
                    alt="EngiSpark Logo"
                >

            </div>


            <!-- Title -->

            <h1>
                🔐 Verification
            </h1>

            <p class="verification-subtitle">
                Verify yourself to continue to EngiSpark.
            </p>


            <!-- Full Name -->

            <label for="fullName">
                Your Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
            >


            <!-- CAPTCHA -->

            <label>
                CAPTCHA
            </label>

            <div class="captcha">

                <span
                    id="captchaText"
                    class="captcha-text"
                >
                    Loading...
                </span>

                <button
                    type="button"
                    onclick="generateCaptcha()"
                    class="captcha-refresh"
                    aria-label="Generate new CAPTCHA"
                >
                    ↻
                </button>

            </div>


            <!-- CAPTCHA Input -->

            <label for="captchaInput">
                Enter CAPTCHA
            </label>

            <input
                type="text"
                id="captchaInput"
                placeholder="Type the CAPTCHA"
                autocomplete="off"
                maxlength="5"
            >


            <!-- Error -->

            <p
                id="verifyError"
                class="error"
                role="alert"
            ></p>


            <!-- Verify -->

            <button
                type="button"
                class="primary full"
                onclick="verifyUser()"
            >
                Verify & Continue
            </button>

        </section>

    </main>


    <!-- =================================================
         FOOTER
         ================================================= -->

    <footer class="site-footer">

        <div class="footer-container">

            <div class="footer-logo">

                <img
                    src="engispark-logo.png"
                    alt="EngiSpark Logo"
                >

            </div>

            <h3 class="footer-brand">
                EngiSpark
            </h3>

            <p class="footer-tagline">
                Ignite Your Engineering Mind
            </p>

            <p class="footer-founder">
                Founder:
                <strong>EngiSpark.com</strong>
            </p>

            <p class="footer-copy">
                © 2026 EngiSpark. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script src="script.js"></script>

</body>

</html>
