<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiSpark — Result</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="engispark-logo.png">
</head>
<body>
    <div class="result-container">
        <div class="result-logo">
            <img src="engispark-logo.png" alt="EngiSpark Logo" class="result-logo-img">
            <h1 class="result-app-name">EngiSpark</h1>
            <p class="result-tagline">Ignite Your Engineering Mind</p>
        </div>
        <div class="result-box">
            <h2>🎉 রেজাল্ট!</h2>
            <div class="result-score">
                <span id="scoreDisplay" class="score-number">৮/১০</span>
                <span id="percentageDisplay" class="score-percentage">⭐⭐⭐⭐⭐ (৮০%)</span>
            </div>
            <div class="result-stats">
                <div class="stat-card correct">✔ সঠিক: <span id="correctCount">৮</span>টি</div>
                <div class="stat-card wrong">✘ ভুল: <span id="wrongCount">২</span>টি</div>
            </div>
            <div class="result-time">⏱️ সময় লেগেছে: <span id="timeTaken">১২ মিনিট ৩০ সেকেন্ড</span></div>
            <div class="wrong-answers">
                <h4>❌ ভুল উত্তরগুলো</h4>
                <div id="wrongAnswersList"></div>
            </div>
            <div class="result-buttons">
                <button onclick="retakeQuiz()" class="btn-primary btn-retake">🔄 Retake Quiz</button>
                <button onclick="goHome()" class="btn-secondary btn-home">🏠 হোম</button>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="engispark-logo.png" alt="EngiSpark Logo" class="footer-logo-img">
                    <span class="footer-app-name">EngiSpark</span>
                </div>
                <p class="footer-tagline">Ignite Your Engineering Mind</p>
                <p class="footer-founder">
                    Founder: <a href="https://engispark.com" target="_blank">EngiSpark.com</a>
                </p>
                <p class="footer-copyright">© 2026 EngiSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
