<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verification - EngiSpark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page center">

    <!-- =========================
         VERIFICATION CARD
         ========================= -->

    <main class="card auth">

        <!-- Logo -->
        <img
            src="engispark-logo.png"
            alt="EngiSpark Logo"
            class="logo"
        >

        <h1>🔐 Verification</h1>

        <p class="muted">
            Verify yourself to continue to EngiSpark.
        </p>


        <!-- Full Name -->

        <label for="userName">
            Your Full Name
        </label>

        <input
            type="text"
            id="userName"
            placeholder="Enter your full name"
            autocomplete="name"
        >


        <!-- CAPTCHA -->

        <label>
            CAPTCHA
        </label>

        <div class="captcha">

            <b id="captchaCode">
                Loading...
            </b>

            <button
                type="button"
                onclick="generateCaptcha()"
                aria-label="Generate new CAPTCHA"
            >
                ↻
            </button>

        </div>


        <!-- CAPTCHA Input -->

        <label for="captchaInput">
            Enter CAPTCHA
        </label>

        <input
            type="text"
            id="captchaInput"
            placeholder="Type the CAPTCHA"
            autocomplete="off"
            maxlength="5"
        >


        <!-- Error -->

        <p
            id="verificationError"
            class="error"
            role="alert"
        ></p>


        <!-- Verify Button -->

        <button
            type="button"
            class="primary full"
            onclick="verifyUser()"
        >
            Verify & Continue
        </button>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="site-footer">

        <div class="footer-brand">

            <img
                src="engispark-logo.png"
                alt="EngiSpark Logo"
                class="footer-logo"
            >

            <div class="footer-brand-text">

                <strong>
                    EngiSpark
                </strong>

                <span>
                    Ignite Your Engineering Mind
                </span>

            </div>

        </div>

        <p class="footer-founder">
            Founder: EngiSpark.com
        </p>

        <p class="footer-copyright">
            © 2026 EngiSpark. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
