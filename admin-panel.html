<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiSpark — Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="engispark-logo.png">
</head>
<body>
    <div class="admin-panel-container">
        <header class="admin-panel-header">
            <div class="header-left">
                <img src="engispark-logo.png" alt="EngiSpark Logo" class="header-logo">
                <span class="header-app-name">EngiSpark</span>
            </div>
            <div class="header-right">
                <button onclick="logoutAdmin()" class="btn-logout">🚪 লগআউট</button>
            </div>
        </header>
        <h2 class="admin-panel-title">🛠️ অ্যাডমিন ড্যাশবোর্ড</h2>
        
        <section class="admin-section">
            <h3>⏱️ টাইমার এডিট</h3>
            <div class="admin-form-row">
                <input type="number" id="timeInput" value="15" min="5" max="60" class="form-input">
                <span>মিনিট</span>
                <button onclick="updateTimer()" class="btn-primary">আপডেট</button>
            </div>
        </section>

        <section class="admin-section">
            <h3>🏢 ডিপার্টমেন্ট ম্যানেজ</h3>
            <div class="admin-form-row">
                <input type="text" id="deptInput" placeholder="নতুন ডিপার্টমেন্ট" class="form-input">
                <button onclick="addDepartment()" class="btn-primary">➕ অ্যাড</button>
            </div>
            <div id="deptList" class="admin-list"></div>
        </section>

        <section class="admin-section">
            <h3>📖 সাবজেক্ট ম্যানেজ</h3>
            <div class="admin-form-row">
                <input type="text" id="subjectInput" placeholder="নতুন সাবজেক্ট" class="form-input">
                <button onclick="addSubject()" class="btn-primary">➕ অ্যাড</button>
            </div>
            <div id="subjectList" class="admin-list"></div>
        </section>

        <section class="admin-section">
            <h3>❓ প্রশ্ন ম্যানেজ</h3>
            <div class="question-form">
                <div class="form-group">
                    <label>প্রশ্ন</label>
                    <input type="text" id="qText" placeholder="প্রশ্ন লিখুন" class="form-input">
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label>অপশন ক</label>
                        <input type="text" id="qOptA" placeholder="অপশন ক" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>অপশন খ</label>
                        <input type="text" id="qOptB" placeholder="অপশন খ" class="form-input">
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label>অপশন গ</label>
                        <input type="text" id="qOptC" placeholder="অপশন গ" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>অপশন ঘ</label>
                        <input type="text" id="qOptD" placeholder="অপশন ঘ" class="form-input">
                    </div>
                </div>
                <div class="form-row-3">
                    <div class="form-group">
                        <label>সঠিক উত্তর</label>
                        <select id="qCorrect" class="form-select">
                            <option value="A">ক</option>
                            <option value="B">খ</option>
                            <option value="C">গ</option>
                            <option value="D">ঘ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>সাবজেক্ট</label>
                        <select id="qSubject" class="form-select">
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Basic Electrical">Basic Electrical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ডিফিকাল্টি</label>
                        <select id="qDifficulty" class="form-select">
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>
                <button onclick="addQuestion()" class="btn-primary">➕ অ্যাড প্রশ্ন</button>
            </div>
            <div id="questionList" class="question-list"></div>
        </section>

        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="engispark-logo.png" alt="EngiSpark Logo" class="footer-logo-img">
                    <span class="footer-app-name">EngiSpark</span>
                </div>
                <p class="footer-tagline">Ignite Your Engineering Mind</p>
                <p class="footer-founder">
                    Founder: <a href="https://engispark.com" target="_blank">EngiSpark.com</a>
                </p>
                <p class="footer-copyright">© 2026 EngiSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
