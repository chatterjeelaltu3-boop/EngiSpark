<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiSpark — Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="engispark-logo.png">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <img src="engispark-logo.png" alt="EngiSpark Logo" class="header-logo">
                <span class="header-app-name">EngiSpark</span>
            </div>
            <div class="header-right">
                <button onclick="goToAdminLogin()" class="btn-admin">🔐 অ্যাডমিন</button>
            </div>
        </header>
        <section class="welcome-section">
            <h2>👋 Welcome, <span id="userNameDisplay">User</span>!</h2>
            <div class="popup-message">
                <img src="engispark-logo.png" alt="EngiSpark Logo" class="popup-logo">
                <p>স্বাগতম <strong>EngiSpark</strong> এ!</p>
                <p class="popup-tagline">Ignite Your Engineering Mind</p>
            </div>
        </section>
        <section class="quiz-setup-section">
            <div class="quiz-setup-card">
                <h3>📝 Start Quiz</h3>
                <div class="setup-form">
                    <div class="form-group">
                        <label>📚 ইয়ার</label>
                        <select id="yearSelect" class="form-select">
                            <option value="1st">1st Year</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏢 ডিপার্টমেন্ট</label>
                        <select id="departmentSelect" class="form-select">
                            <option value="CSE">CSE</option>
                            <option value="EEE">EEE</option>
                            <option value="Civil">Civil</option>
                            <option value="Mechanical">Mechanical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📖 সাবজেক্ট</label>
                        <select id="subjectSelect" class="form-select">
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Basic Electrical">Basic Electrical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>⚡ ডিফিকাল্টি</label>
                        <select id="difficultySelect" class="form-select">
                            <option value="Easy">Easy</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>⏱️ সময়</label>
                        <select id="timeSelect" class="form-select">
                            <option value="10">১০ মিনিট</option>
                            <option value="15" selected>১৫ মিনিট</option>
                            <option value="20">২০ মিনিট</option>
                        </select>
                    </div>
                    <button onclick="startQuiz()" class="btn-primary btn-start">🚀 Start Quiz</button>
                </div>
            </div>
        </section>
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="engispark-logo.png" alt="EngiSpark Logo" class="footer-logo-img">
                    <span class="footer-app-name">EngiSpark</span>
                </div>
                <p class="footer-tagline">Ignite Your Engineering Mind</p>
                <p class="footer-founder">
                    Founder: <a href="https://engispark.com" target="_blank">EngiSpark.com</a>
                </p>
                <p class="footer-copyright">© 2026 EngiSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
